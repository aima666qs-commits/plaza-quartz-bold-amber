<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "LibSerif";
      src: url("LiberationSerif-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "LibSerif";
      src: url("LiberationSerif-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "FreeSerif";
      src: url("FreeSerif.ttf") format("truetype");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #04100c; }
    .frame { position: relative; width: 1200px; height: 630px; }
    .bg { position: absolute; inset: 0; width: 1200px; height: 630px; object-fit: cover; }
    .veil {
      position: absolute; inset: 0;
      background:
        linear-gradient(180deg, rgba(4,16,12,0.55) 0%, rgba(4,16,12,0.12) 42%, rgba(4,16,12,0.35) 100%),
        radial-gradient(ellipse 58% 42% at 50% 22%, rgba(4,16,12,0.5), transparent 70%);
    }
    .lockup {
      position: absolute;
      left: 180px; right: 180px; top: 58px;
      display: flex; flex-direction: column; align-items: center;
    }
    .mark {
      font-family: "FreeSerif", serif;
      font-size: 42px;
      line-height: 1;
      color: #f0cf7a;
      text-shadow: 0 2px 18px rgba(4,16,12,0.8);
    }
    .title {
      margin-top: 8px;
      font-family: "LibSerif", Georgia, serif;
      font-weight: 700;
      font-size: 92px;
      line-height: 0.95;
      color: #f8f4e9;
      letter-spacing: 0.18em;
      padding-left: 0.18em;
      text-shadow: 0 2px 0 rgba(4,16,12,0.5), 0 10px 32px rgba(4,16,12,0.7);
    }
    .rule {
      width: 96px; height: 2px; margin: 16px 0 14px;
      background: linear-gradient(90deg, transparent, #c49b45 20%, #f0cf7a 50%, #c49b45 80%, transparent);
    }
    .tag {
      font-family: "LibSerif", Georgia, serif;
      font-size: 20px;
      color: #f0cf7a;
      letter-spacing: 0.28em;
      padding-left: 0.28em;
      text-shadow: 0 2px 14px rgba(4,16,12,0.8);
    }
  </style>
</head>
<body>
  <div class="frame">
    <img class="bg" src="og-bg.jpg" alt="" />
    <div class="veil"></div>
    <div class="lockup">
      <div class="mark">م</div>
      <h1 class="title">Мизан</h1>
      <div class="rule"></div>
      <p class="tag">закят · Коран · хисн</p>
    </div>
  </div>
</body>
</html>
