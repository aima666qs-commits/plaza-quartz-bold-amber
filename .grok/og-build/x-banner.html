<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "LibSerif";
      src: url("LiberationSerif-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "LibSerif";
      src: url("LiberationSerif-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "FreeSerif";
      src: url("FreeSerif.ttf") format("truetype");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 264px; overflow: hidden; background: #04100c; }
    .frame { position: relative; width: 1200px; height: 264px; }
    .bg { position: absolute; inset: 0; width: 1200px; height: 264px; object-fit: cover; object-position: center; }
    .veil {
      position: absolute; inset: 0;
      background:
        linear-gradient(90deg, rgba(4,16,12,0.78) 0%, rgba(4,16,12,0.48) 32%, rgba(4,16,12,0.1) 58%, transparent 80%),
        linear-gradient(180deg, rgba(4,16,12,0.18) 0%, transparent 48%, rgba(4,16,12,0.4) 100%);
    }
    .lockup {
      position: absolute;
      left: 48px;
      top: 36px;
      width: 540px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .mark {
      font-family: "FreeSerif", serif;
      font-size: 28px;
      line-height: 1;
      color: #f0cf7a;
      text-shadow: 0 2px 12px rgba(4,16,12,0.85);
    }
    .title {
      margin-top: 4px;
      font-family: "LibSerif", Georgia, serif;
      font-weight: 700;
      font-size: 56px;
      line-height: 0.95;
      color: #f8f4e9;
      letter-spacing: 0.14em;
      padding-left: 0.04em;
      text-shadow: 0 2px 0 rgba(4,16,12,0.55), 0 8px 22px rgba(4,16,12,0.75);
    }
    .tag {
      margin-top: 8px;
      font-family: "LibSerif", Georgia, serif;
      font-size: 15px;
      color: #f0cf7a;
      letter-spacing: 0.22em;
      padding-left: 0.08em;
      text-shadow: 0 2px 10px rgba(4,16,12,0.8);
    }
  </style>
</head>
<body>
  <div class="frame">
    <img class="bg" src="banner-bg.jpg" alt="" />
    <div class="veil"></div>
    <div class="lockup">
      <div class="mark">الميزان</div>
      <h1 class="title">Мизан</h1>
      <p class="tag">Закят · Коран · Хисн</p>
    </div>
  </div>
</body>
</html>
