<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "LibSerif";
      src: url("LiberationSerif-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "LibSerif";
      src: url("LiberationSerif-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 264px; overflow: hidden; background: #04100c; }
    .frame { position: relative; width: 1200px; height: 264px; }
    .bg { position: absolute; inset: 0; width: 1200px; height: 264px; object-fit: cover; }
    .veil {
      position: absolute; inset: 0;
      background:
        linear-gradient(90deg, rgba(4,16,12,0.72) 0%, rgba(4,16,12,0.38) 34%, rgba(4,16,12,0.08) 62%, transparent 82%),
        linear-gradient(180deg, rgba(4,16,12,0.22) 0%, transparent 50%, rgba(4,16,12,0.42) 100%);
    }
    .lockup {
      position: absolute;
      left: 48px;
      top: 28px;
      width: 520px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .title {
      font-family: "LibSerif", Georgia, serif;
      font-weight: 700;
      font-size: 58px;
      line-height: 0.95;
      color: #f8f4e9;
      letter-spacing: 0.18em;
      padding-left: 0.04em;
      text-shadow: 0 2px 0 rgba(4,16,12,0.55), 0 8px 22px rgba(4,16,12,0.75);
    }
    .tag {
      margin-top: 10px;
      font-family: "LibSerif", Georgia, serif;
      font-size: 15px;
      color: #f0cf7a;
      letter-spacing: 0.22em;
      padding-left: 0.08em;
      text-shadow: 0 2px 10px rgba(4,16,12,0.8);
    }
  </style>
</head>
<body>
  <div class="frame">
    <img class="bg" src="banner-bg.jpg" alt="" />
    <div class="veil"></div>
    <div class="lockup">
      <h1 class="title">MIZAN</h1>
      <p class="tag">Zakat · Quran · Hisn</p>
    </div>
  </div>
</body>
</html>
