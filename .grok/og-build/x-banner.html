<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "LibSerif";
      src: url("LiberationSerif-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "LibSerif";
      src: url("LiberationSerif-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "FreeSerif";
      src: url("FreeSerif.ttf") format("truetype");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 264px; overflow: hidden; background: #04100c; }
    .frame { position: relative; width: 1200px; height: 264px; }
    .bg { position: absolute; inset: 0; width: 1200px; height: 264px; object-fit: cover; }
    .veil {
      position: absolute; inset: 0;
      background:
        linear-gradient(90deg, rgba(4,16,12,0.62) 0%, rgba(4,16,12,0.28) 42%, rgba(4,16,12,0.08) 72%),
        linear-gradient(180deg, rgba(4,16,12,0.18) 0%, transparent 55%, rgba(4,16,12,0.45) 100%);
    }
    .lockup {
      position: absolute;
      left: 48px; top: 36px;
      width: 520px;
      display: flex; flex-direction: column; align-items: flex-start;
    }
    .mark {
      font-family: "FreeSerif", serif;
      font-size: 22px;
      line-height: 1;
      color: #f0cf7a;
    }
    .title {
      margin-top: 4px;
      font-family: "LibSerif", Georgia, serif;
      font-weight: 700;
      font-size: 64px;
      line-height: 0.95;
      color: #f8f4e9;
      letter-spacing: 0.16em;
      padding-left: 0.04em;
      text-shadow: 0 2px 0 rgba(4,16,12,0.5), 0 8px 22px rgba(4,16,12,0.7);
    }
    .tag {
      margin-top: 10px;
      font-family: "LibSerif", Georgia, serif;
      font-size: 15px;
      color: #f0cf7a;
      letter-spacing: 0.22em;
      padding-left: 0.06em;
    }
  </style>
</head>
<body>
  <div class="frame">
    <img class="bg" src="banner-bg.jpg" alt="" />
    <div class="veil"></div>
    <div class="lockup">
      <div class="mark">م</div>
      <h1 class="title">Мизан</h1>
      <p class="tag">закят · Коран · хисн</p>
    </div>
  </div>
</body>
</html>
