<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "LibSerif";
      src: url("LiberationSerif-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "LibSerif";
      src: url("LiberationSerif-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "FreeSerif";
      src: url("FreeSerif.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0b2e23;
    }
    .frame {
      position: relative;
      width: 1200px;
      height: 630px;
    }
    .frame img.bg {
      position: absolute;
      inset: 0;
      width: 1200px;
      height: 630px;
      object-fit: cover;
      display: block;
    }
    .veil {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 72% 50% at 50% 18%, rgba(5,18,14,0.42) 0%, rgba(5,18,14,0.12) 46%, transparent 72%),
        linear-gradient(180deg, rgba(5,16,13,0.22) 0%, transparent 38%);
    }
    .lockup {
      position: absolute;
      left: 0;
      right: 0;
      top: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .mark {
      font-family: "FreeSerif", serif;
      font-size: 30px;
      line-height: 1;
      color: #c49b45;
      text-shadow: 0 2px 16px rgba(11,46,35,0.7);
      margin-bottom: 10px;
    }
    .title {
      font-family: "LibSerif", Georgia, serif;
      font-weight: 700;
      font-size: 108px;
      line-height: 0.92;
      color: #f8f4e9;
      letter-spacing: 0.16em;
      padding-left: 0.16em;
      text-shadow:
        0 2px 0 rgba(11,46,35,0.45),
        0 8px 28px rgba(5,16,13,0.55),
        0 0 36px rgba(196,155,69,0.22);
    }
    .rule {
      width: 88px;
      height: 2px;
      margin: 16px 0 14px;
      background: linear-gradient(90deg, transparent, #c49b45 18%, #f0cf7a 50%, #c49b45 82%, transparent);
      border-radius: 1px;
    }
    .tag {
      font-family: "LibSerif", Georgia, serif;
      font-weight: 400;
      font-size: 22px;
      line-height: 1;
      color: #c49b45;
      letter-spacing: 0.38em;
      padding-left: 0.38em;
      text-shadow: 0 2px 14px rgba(5,16,13,0.7);
    }
  </style>
</head>
<body>
  <div class="frame">
    <img class="bg" src="bg.jpg" alt="" />
    <div class="veil"></div>
    <div class="lockup">
      <div class="mark">م</div>
      <h1 class="title">Мизан</h1>
      <div class="rule"></div>
      <p class="tag">калькулятор закята</p>
    </div>
  </div>
</body>
</html>
